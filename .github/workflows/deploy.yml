name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Firebase Credentials
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: |
          if [ -n "$FIREBASE_CREDENTIALS_JSON" ]; then
            if echo "$FIREBASE_CREDENTIALS_JSON" | grep -qv '^{' && echo "$FIREBASE_CREDENTIALS_JSON" | base64 -d > /dev/null 2>&1; then
              echo "$FIREBASE_CREDENTIALS_JSON" | base64 -d > src/Hosts/LegendsTeamVN.BadmintonClub.API/sports-venue-cb204-firebase-adminsdk-fbsvc-7f5ec12fb1.json
            else
              echo "$FIREBASE_CREDENTIALS_JSON" > src/Hosts/LegendsTeamVN.BadmintonClub.API/sports-venue-cb204-firebase-adminsdk-fbsvc-7f5ec12fb1.json
            fi
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          
      - name: Restore dependencies
        run: dotnet restore LegendsTeamVN.BadmintonClub.slnx
        
      - name: Build
        run: dotnet build LegendsTeamVN.BadmintonClub.slnx --no-restore -c Release
        
      - name: Test
        run: dotnet test LegendsTeamVN.BadmintonClub.slnx --no-build --verbosity normal -c Release

  build-and-push-docker:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Convert Image Name to Lowercase
        run: echo "IMAGE_NAME_LC=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Setup Firebase Credentials
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: |
          if [ -n "$FIREBASE_CREDENTIALS_JSON" ]; then
            if echo "$FIREBASE_CREDENTIALS_JSON" | grep -qv '^{' && echo "$FIREBASE_CREDENTIALS_JSON" | base64 -d > /dev/null 2>&1; then
              echo "$FIREBASE_CREDENTIALS_JSON" | base64 -d > src/Hosts/LegendsTeamVN.BadmintonClub.API/sports-venue-cb204-firebase-adminsdk-fbsvc-7f5ec12fb1.json
            else
              echo "$FIREBASE_CREDENTIALS_JSON" > src/Hosts/LegendsTeamVN.BadmintonClub.API/sports-venue-cb204-firebase-adminsdk-fbsvc-7f5ec12fb1.json
            fi
          fi
        
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
            
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Migrator Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.migrator
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}-migrator:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}-migrator:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push-docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: badmintonclub-server-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare Firebase Credentials for Server
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: |
          if [ -n "$FIREBASE_CREDENTIALS_JSON" ]; then
            if echo "$FIREBASE_CREDENTIALS_JSON" | grep -qv '^{' && echo "$FIREBASE_CREDENTIALS_JSON" | base64 -d > /dev/null 2>&1; then
              echo "$FIREBASE_CREDENTIALS_JSON" | base64 -d > sports-venue-cb204-firebase-adminsdk-fbsvc-7f5ec12fb1.json
            else
              echo "$FIREBASE_CREDENTIALS_JSON" > sports-venue-cb204-firebase-adminsdk-fbsvc-7f5ec12fb1.json
            fi
          else
            touch sports-venue-cb204-firebase-adminsdk-fbsvc-7f5ec12fb1.json
          fi
      
      - name: Copy deployment files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml,sports-venue-cb204-firebase-adminsdk-fbsvc-7f5ec12fb1.json"
          target: "~/badmintonclub/"

      - name: Deploy to self-hosted server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.sha }}
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ github.repository }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          REDIS_CONNECTION_STRING: ${{ secrets.REDIS_CONNECTION_STRING }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRE_MIN: ${{ secrets.JWT_EXPIRE_MIN }}
          RABBITMQ_HOST: ${{ secrets.RABBITMQ_HOST }}
          RABBITMQ_VHOST: ${{ secrets.RABBITMQ_VHOST }}
          RABBITMQ_PORT: ${{ secrets.RABBITMQ_PORT }}
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASS: ${{ secrets.RABBITMQ_PASS }}
          SETTLEMENT_WRITES_ENABLED: ${{ secrets.SETTLEMENT_WRITES_ENABLED || 'false' }}
          SETTLEMENT_DISPATCH_ENABLED: ${{ secrets.SETTLEMENT_DISPATCH_ENABLED || 'false' }}
          SETTLEMENT_PREVIEW_SIGNING_KEY: ${{ secrets.SETTLEMENT_PREVIEW_SIGNING_KEY }}
          RECONCILIATION_ENABLED: ${{ secrets.RECONCILIATION_ENABLED || 'false' }}
          RECONCILIATION_WRITES_ENABLED: ${{ secrets.RECONCILIATION_WRITES_ENABLED || 'false' }}
          RECONCILIATION_DISPATCH_ENABLED: ${{ secrets.RECONCILIATION_DISPATCH_ENABLED || 'false' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DEPLOY_SHA,IMAGE_REPOSITORY,REGISTRY_USER,REGISTRY_TOKEN,DB_CONNECTION_STRING,REDIS_CONNECTION_STRING,JWT_ISSUER,JWT_AUDIENCE,JWT_SECRET,JWT_EXPIRE_MIN,RABBITMQ_HOST,RABBITMQ_VHOST,RABBITMQ_PORT,RABBITMQ_USER,RABBITMQ_PASS,SETTLEMENT_WRITES_ENABLED,SETTLEMENT_DISPATCH_ENABLED,SETTLEMENT_PREVIEW_SIGNING_KEY,RECONCILIATION_ENABLED,RECONCILIATION_WRITES_ENABLED,RECONCILIATION_DISPATCH_ENABLED
          script: |
            set -eu
            umask 077
            cd "$HOME/badmintonclub"
            
            : "${DEPLOY_SHA:?Cần SHA được deploy}"
            : "${IMAGE_REPOSITORY:?Cần image repository}"
            : "${REGISTRY_USER:?Cần registry user}"
            : "${REGISTRY_TOKEN:?Cần registry token}"
            : "${DB_CONNECTION_STRING:?Cần database connection}"
            : "${REDIS_CONNECTION_STRING:?Cần Redis connection}"
            : "${JWT_SECRET:?Cần JWT secret}"
            case "$DEPLOY_SHA" in *[!0-9a-f]*|'') exit 1 ;; esac
            [ "${#DEPLOY_SHA}" -eq 40 ] || exit 1
            
            write_env() {
                case "$2" in *'
            '*) printf '%s\n' 'Cấu hình deployment phải nằm trên một dòng.' >&2; exit 1 ;; esac
                escaped=$(printf '%s' "$2" | sed "s/'/\\\\'/g")
                printf "%s='%s'\n" "$1" "$escaped" >> .env.next
            }
            
            image_repository=$(printf '%s' "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')
            api_image="$image_repository:sha-$DEPLOY_SHA"
            migrator_image="$image_repository-migrator:sha-$DEPLOY_SHA"
            evidence_directory="$HOME/.local/share/badmintonclub/reconciliation-evidence"
            key_directory="$HOME/.local/share/badmintonclub/sepay-keys"
            mkdir -p "$evidence_directory"
            mkdir -p "$key_directory"
            chmod 700 "$evidence_directory"
            chmod 700 "$key_directory"
            chmod 600 sports-venue-cb204-firebase-adminsdk-fbsvc-7f5ec12fb1.json
            
            printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            docker pull "$api_image"
            docker pull "$migrator_image"
            
            : > .env.next
            write_env API_IMAGE "$api_image"
            write_env MIGRATOR_IMAGE "$migrator_image"
            write_env RECONCILIATION_EVIDENCE_DIRECTORY "$evidence_directory"
            write_env SEPAY_KEY_DIRECTORY "$key_directory"
            export API_IMAGE="$api_image"
            export MIGRATOR_IMAGE="$migrator_image"
            export RECONCILIATION_EVIDENCE_DIRECTORY="$evidence_directory"
            export SEPAY_KEY_DIRECTORY="$key_directory"
            for name in DB_CONNECTION_STRING REDIS_CONNECTION_STRING JWT_ISSUER JWT_AUDIENCE JWT_SECRET JWT_EXPIRE_MIN RABBITMQ_HOST RABBITMQ_VHOST RABBITMQ_PORT RABBITMQ_USER RABBITMQ_PASS SETTLEMENT_WRITES_ENABLED SETTLEMENT_DISPATCH_ENABLED SETTLEMENT_PREVIEW_SIGNING_KEY RECONCILIATION_ENABLED RECONCILIATION_WRITES_ENABLED RECONCILIATION_DISPATCH_ENABLED; do
                value=$(printenv "$name")
                write_env "$name" "$value"
            done
            
            docker compose --env-file .env.next config --quiet
            docker compose --env-file .env.next run --rm --no-deps -e Seeding__Enabled=false -e Migrations__VerifyOnly=false migrator
            docker compose --env-file .env.next run --rm --no-deps -e Migrations__VerifyOnly=true migrator
            if [ -f .env ]; then cp -p .env ".env.before-$DEPLOY_SHA"; fi
            mv .env.next .env
            docker compose up -d --no-deps --force-recreate api
            
            attempt=0
            until curl --fail --silent --show-error http://127.0.0.1:8080/swagger/v1/swagger.json -o .uc18-swagger.json; do
                attempt=$((attempt + 1))
                [ "$attempt" -lt 30 ] || exit 1
                sleep 2
            done
            grep -Fq '/webhooks/sepay/' .uc18-swagger.json
            grep -Fq '/reconciliations' .uc18-swagger.json
            printf '%s\n' 'Đã deploy API UC18 với schema đã chuẩn bị. Chưa xác nhận nghiệm thu SePay/FCM thực.'
